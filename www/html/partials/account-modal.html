<div class="modal-overlay" id="account-modal">
  <div class="modal">
    <h3 id="modal-title">新增特殊權限帳號</h3>
    <div class="form-grid">
      <div class="form-group">
        <label>系統名稱 *</label>
        <input class="form-control" id="f-system_name" placeholder="e.g. Sysldap">
      </div>
      <div class="form-group">
        <label>類別 *</label>
        <select class="form-control" id="f-environment">
          <option value="開發區">開發區</option>
          <option value="測試區">測試區</option>
          <option value="正式區" selected>正式區</option>
        </select>
      </div>
      <div class="form-group">
        <label>IP 位址 *</label>
        <input class="form-control" id="f-ip_address" placeholder="e.g. 10.109.4.9">
      </div>
      <div class="form-group">
        <label>盤點日期 *</label>
        <input class="form-control" id="f-inventory_date" placeholder="e.g. 20260803">
      </div>
      <div class="form-group">
        <label>帳號名稱 *</label>
        <input class="form-control" id="f-account_name" placeholder="e.g. root">
      </div>
      <div class="form-group">
        <label>帳號種類 *</label>
        <select class="form-control" id="f-account_type">
          <option value="預設">預設</option>
          <option value="系統管理用">系統管理用</option>
          <option value="關閉帳號">關閉帳號</option>
        </select>
      </div>
      <div class="form-group">
        <label>通行碼定期變更</label>
        <select class="form-control" id="f-passphrase_rotate">
          <option value="是">是</option>
          <option value="否">否</option>
          <option value="NA">NA</option>
        </select>
      </div>
      <div class="form-group">
        <label>單位名稱</label>
        <input type="text" class="form-control" id="f-department" placeholder="例如：資安組">
      </div>
      <div class="form-group">
        <label>單位代碼</label>
        <input type="text" class="form-control" id="f-department_code" placeholder="例如：A01">
      </div>
      <div class="form-group">
        <label>使用者姓名</label>
        <input class="form-control" id="f-owner_name" placeholder="e.g. 顏景喆">
      </div>
      <div class="form-group full">
        <label>Email（用於確認通知）</label>
        <input class="form-control" id="f-email" type="email" placeholder="user@example.com">
      </div>
      <div class="form-group">
        <label>狀態</label>
        <select class="form-control" id="f-status">
          <option value="active">使用中</option>
          <option value="pending">待確認</option>
          <option value="closed">已關閉</option>
          <option value="expired">已過期</option>
        </select>
      </div>
      <div class="form-group full">
        <label>備註</label>
        <textarea class="form-control" id="f-remarks" rows="2" placeholder="選填"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('account-modal')">取消</button>
      <button class="btn btn-primary" onclick="saveAccount()">💾 儲存</button>
    </div>
  </div>
</div>
